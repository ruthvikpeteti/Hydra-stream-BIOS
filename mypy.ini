[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
check_untyped_defs = True
explicit_package_bases = True
exclude = (\.venv|node_modules|/tests/)

# Typing debt, stated rather than hidden: these modules were written against Optional-returning helpers and are checked with a reduced
# error set. Everything else (ss_dr, ss_obs, ss_replication except two numeric modules, the gateway) is checked in full.
[mypy-engine_service.*]
disable_error_code = union-attr, arg-type, var-annotated, assignment, return-value, index
[mypy-agent_service.*]
disable_error_code = union-attr, arg-type, var-annotated, assignment, return-value, index, attr-defined, operator
[mypy-ss_policy.engine]
disable_error_code = union-attr, arg-type, var-annotated, assignment, return-value, index, attr-defined, operator
[mypy-ss_policy.agent_core]
disable_error_code = union-attr, arg-type, var-annotated, assignment, return-value, index, attr-defined, operator
[mypy-ss_replication.cutover]
disable_error_code = operator, type-var
[mypy-ss_replication.routing]
disable_error_code = operator, index
